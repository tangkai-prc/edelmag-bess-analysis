<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porvenir SCADA 2024-2025 Interactive Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      --border: #d6dbe3;
      --text: #1f2937;
      --muted: #6b7280;
      --panel: #f8fafc;
      --active: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      color: var(--text);
      background: #ffffff;
      overflow: hidden;
    }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: nowrap;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .year-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    button.active {
      background: var(--active);
      border-color: var(--active);
      color: #ffffff;
    }
    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      display: none;
    }
    .help {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">Porvenir SCADA Interactive Preview</div>
      <div class="year-nav">
        <button type="button" class="active" data-year="2024">2024</button>
        <button type="button" data-year="2025">2025</button>
      </div>
      <div class="help">Wheel: zoom | Drag: pan | Click daily point: detail | Right click: back | Filter: show/hide curves</div>
      <div id="status" class="status"></div>
    </div>
    <iframe id="viewer" src="porvenir_2024_analysis_charts/2024_Interactive_Preview.html" title="Porvenir SCADA yearly preview"></iframe>
  </div>
  <script>
    const pages = {
      "2024": {
        src: "porvenir_2024_analysis_charts/2024_Interactive_Preview.html",
        label: "2024 Feb-Mar-Apr",
      },
      "2025": {
        src: "porvenir_2025_analysis_charts/2025_Interactive_Preview.html",
        label: "2025 Jan-Feb",
      },
    };

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    const buttons = Array.from(document.querySelectorAll("[data-year]"));

    function showYear(year) {
      const page = pages[year];
      if (!page) return;
      viewer.src = page.src;
      status.textContent = page.label;
      for (const button of buttons) {
        button.classList.toggle("active", button.dataset.year === year);
      }
      document.title = `Porvenir SCADA ${year} Interactive Preview`;
    }

    for (const button of buttons) {
      button.addEventListener("click", () => showYear(button.dataset.year));
    }
  </script>
</body>
</html>
